<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLOCKITY // Neural Sound Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://telegram-web-app.com/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0e12;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
    }
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, .35);
      border-radius: 999px;
    }
    @keyframes wave {
      0%, 100% { transform: scaleY(.72); opacity: .65; }
      50% { transform: scaleY(1.08); opacity: 1; }
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(16px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.25; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useCallback, useEffect, useMemo, useRef, useState } = React;

    const MAX_SLOTS = 15;
    const INITIAL_FILES = { loops: [], shots: [] };

    const clamp = (value, min, max) => Math.min(max, Math.max(min, Number(value)));

    function cn(...classes) {
      return classes.filter(Boolean).join(" ");
    }

    const getTelegramUsername = () => {
      try {
        if (window.Telegram?.WebApp?.initDataUnsafe?.user?.username) {
          return window.Telegram.WebApp.initDataUnsafe.user.username;
        }
      } catch (e) {
        console.warn("Telegram WebApp not available:", e);
      }
      return "guest";
    };

    /* ========== ICONS ========== */
    function TelegramIcon({ size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21.6 3.5 18.4 20c-.24 1.17-.87 1.46-1.76.91l-4.83-3.56-2.33 2.24c-.26.26-.48.48-.98.48l.35-4.92 8.96-8.09c.39-.35-.09-.55-.6-.2L6.13 13.8l-4.75-1.49c-1.03-.32-1.05-1.03.21-1.52L20.15 3.02c.87-.32 1.63.2 1.45.48Z" fill="currentColor" />
        </svg>
      );
    }
    function InstagramIcon({ size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      );
    }
    function UploadIcon({ size = 24 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      );
    }
    function PlayIcon({ size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 5.5v13l11-6.5L8 5.5Z" fill="currentColor" />
        </svg>
      );
    }
    function PauseIcon({ size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z" fill="currentColor" />
        </svg>
      );
    }
    function XIcon({ size = 15 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
        </svg>
      );
    }

    /* ========== HARDWARE ELEMENTS ========== */
    function Screw() {
      return (
        <div className="relative h-[11px] w-[11px] shrink-0 rounded-full border border-white/70 bg-[radial-gradient(circle_at_35%_30%,#fafafa_0%,#a6a8ad_40%,#53565c_75%,#22252a_100%)] shadow-[inset_1px_1px_2px_rgba(255,255,255,.9),inset_-1px_-1px_2px_rgba(0,0,0,.6),0_1px_2px_rgba(0,0,0,.35)]">
          <span className="absolute left-[2px] top-1/2 h-px w-[6px] -translate-y-1/2 rotate-45 bg-black/60" />
        </div>
      );
    }
    function LED({ active = false }) {
      return (
        <span
          className={cn(
            "inline-block h-2 w-2 rounded-full transition-all duration-300",
            active ? "bg-[#c084fc] shadow-[0_0_5px_#a855f7,0_0_12px_#a855f7]" : "bg-[#282b31] shadow-[inset_0_1px_2px_black]"
          )}
        />
      );
    }

    /* ========== WAVEFORM ========== */
    function Waveform({ active = false, audioData = null }) {
      const bars = useMemo(() => {
        const count = 68;
        if (audioData && audioData.length > 0) {
          const step = Math.floor(audioData.length / count);
          return Array.from({ length: count }, (_, i) => {
            const sample = Math.abs(audioData[i * step] || 0);
            return Math.round(6 + sample * 60);
          });
        }
        return Array.from({ length: count }, (_, index) => {
          const waveA = Math.sin(index * 0.55) * 0.5 + 0.5;
          const waveB = Math.sin(index * 1.73 + 1) * 0.5 + 0.5;
          const waveC = Math.sin(index * 3.7) * 0.5 + 0.5;
          return Math.round(6 + (waveA * 0.58 + waveB * 0.27 + waveC * 0.15) * 55);
        });
      }, [audioData]);

      return (
        <div className="flex h-[90px] w-full items-center justify-center gap-[2px] overflow-hidden px-2">
          {bars.map((height, index) => (
            <span
              key={index}
              className={cn(
                "min-w-[2px] flex-1 rounded-full",
                active ? "bg-[#c084fc] shadow-[0_0_5px_rgba(168,85,247,.8)]" : "bg-[#a855f7]/60",
                active && "animate-[wave_1.4s_ease-in-out_infinite]"
              )}
              style={{
                height: `${height}px`,
                animationDelay: `${index * -22}ms`,
              }}
            />
          ))}
        </div>
      );
    }

    /* ========== SLOT MANAGER MODAL ========== */
    function SlotManager({ type, files, onClose, onDelete, onPreview, playingIndex }) {
      const isLoop = type === "loops";
      const title = isLoop ? "LOOP BAY" : "SHOT BAY";

      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/65 p-2 backdrop-blur-sm" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="w-full max-w-[390px] overflow-hidden rounded-[24px] border border-white/10 bg-[#191b21] shadow-[0_30px_80px_rgba(0,0,0,.6)] animate-[modalIn_.2s_ease-out]">
            <div className="flex items-center justify-between border-b border-white/[0.07] px-4 py-3">
              <div>
                <div className="font-mono text-[8px] tracking-[0.2em] text-zinc-500">SLOT MANAGER</div>
                <div className="mt-0.5 text-sm font-black text-white">{title}</div>
              </div>
              <button onClick={onClose} className="flex h-8 w-8 items-center justify-center rounded-full border border-white/10 bg-[#111318] text-zinc-400 active:scale-90"><XIcon /></button>
            </div>
            <div className="max-h-[50vh] overflow-y-auto p-3">
              {files.length === 0 ? (
                <div className="flex min-h-[120px] items-center justify-center rounded-2xl border border-dashed border-white/10 bg-[#111318]">
                  <div className="text-center font-mono text-[9px] tracking-[0.15em] text-zinc-600">BAY EMPTY</div>
                </div>
              ) : (
                <div className="space-y-1.5">
                  {files.map((file, index) => (
                    <div key={file.id} className="flex items-center gap-2 rounded-xl border border-white/[0.06] bg-[#111318] p-2">
                      <button onClick={() => onPreview(index)} className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#272a31] text-[#c084fc] shadow-[inset_0_1px_2px_rgba(255,255,255,.08),0_2px_4px_black] active:scale-90">
                        {playingIndex === index ? <PauseIcon size={13} /> : <PlayIcon size={13} />}
                      </button>
                      <div className="min-w-0 flex-1">
                        <div className="truncate text-[10px] font-bold text-zinc-200">{file.name}</div>
                        <div className="mt-0.5 font-mono text-[8px] text-zinc-600">{(file.size / 1024 / 1024).toFixed(2)} MB</div>
                      </div>
                      <button onClick={() => onDelete(index)} className="flex h-7 w-7 items-center justify-center rounded-full text-zinc-600 hover:bg-red-500/10 hover:text-red-400 active:scale-90"><XIcon size={13} /></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ========== INPUT BAY (DARK STYLE) ========== */
    function InputBay({ bay, count, onFiles, onManage }) {
      const inputRef = useRef(null);
      const [dragActive, setDragActive] = useState(false);
      const isLoop = bay === "loops";

      const processFiles = useCallback((fileList) => {
        const audioFiles = Array.from(fileList || []).filter((file) => file.type.startsWith("audio/") || /\.(wav|mp3|ogg|flac|aac)$/i.test(file.name)).slice(0, MAX_SLOTS - count);
        if (audioFiles.length > 0) onFiles(audioFiles);
      }, [count, onFiles]);

      return (
        <div
          onClick={() => inputRef.current?.click()}
          onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
          onDragLeave={() => setDragActive(false)}
          onDrop={(e) => { e.preventDefault(); setDragActive(false); processFiles(e.dataTransfer.files); }}
          className={cn(
            "relative flex min-h-[96px] w-full cursor-pointer flex-col justify-between overflow-hidden rounded-xl border bg-[#15171d] p-3 shadow-[inset_0_1px_1px_rgba(255,255,255,.04),inset_0_-5px_12px_rgba(0,0,0,.25)] transition-all duration-150 active:scale-[0.99]",
            dragActive ? "border-[#a855f7]" : "border-white/[0.08] hover:border-[#a855f7]/40"
          )}
        >
          <input ref={inputRef} type="file" multiple accept="audio/wav,audio/mpeg,audio/*,.wav,.mp3" className="hidden" onChange={(e) => { processFiles(e.target.files); e.target.value = ""; }} />

          {/* Плавное неоновое дыхание при драг-дропе без текста */}
          {dragActive && (
            <div className="absolute inset-0 z-20 flex items-center justify-center rounded-xl bg-[#c084fc]/10 backdrop-blur-[2px]">
              <div className="animate-[breathe_2.5s_ease-in-out_infinite] text-[#c084fc] drop-shadow-[0_0_10px_rgba(192,132,252,0.8)]">
                <UploadIcon size={32} />
              </div>
            </div>
          )}

          <div className="flex items-center justify-between">
            <div>
              <div className="font-mono text-[8px] tracking-[0.18em] text-zinc-500">BAY // {isLoop ? "01" : "00"}</div>
              <div className="mt-1 text-[11px] font-black tracking-[0.08em] text-zinc-100">{isLoop ? "LOOP SOURCES" : "ONE SHOT SOURCES"}</div>
            </div>
            <LED active={count > 0} />
          </div>

          <div className="flex items-center justify-between">
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onManage(); }}
              className="rounded-lg border border-white/10 bg-[#1f2229] px-4 py-1.5 font-mono text-[8px] font-bold tracking-wide text-zinc-400 transition hover:border-[#a855f7]/40 hover:text-[#c084fc]"
            >
              MANAGE
            </button>
            <div className="text-right">
              <div className="font-mono text-[9px]">
                <span className="text-[#c084fc]">{count}</span>
                <span className="text-zinc-600"> / </span>
                <span className="text-zinc-400">{MAX_SLOTS}</span>
              </div>
              <div className="font-mono text-[7px] text-zinc-600">WAV · MP3</div>
            </div>
          </div>
        </div>
      );
    }

    /* ========== S|M|L SELECTOR (VERTICAL) ========== */
    function RoomSizeSelectorVertical({ value, onChange }) {
      const options = [ { value: "small", label: "S" }, { value: "middle", label: "M" }, { value: "large", label: "L" } ];
      return (
        <div className="flex flex-col items-center gap-1">
          <div className="font-mono text-[7px] tracking-[0.2em] text-zinc-500 mb-1">ROOM</div>
          <div className="flex flex-col rounded-lg border border-white/10 bg-[#16191f] p-0.5 shadow-[inset_0_1px_3px_black]">
            {options.map((option) => (
              <button
                key={option.value}
                type="button"
                onClick={() => onChange(option.value)}
                className={cn(
                  "min-h-[32px] w-[34px] rounded-md flex items-center justify-center font-mono text-[11px] font-black tracking-wide transition-all",
                  value === option.value ? "bg-[#a855f7] text-white shadow-[0_0_8px_rgba(168,85,247,.4)]" : "text-zinc-500 hover:text-zinc-300"
                )}
              >
                {option.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    /* ========== BPM CONTROL ========== */
    function BpmControl({ value, onChange }) {
      const [editing, setEditing] = useState(false);
      const [tempValue, setTempValue] = useState(String(value));
      const inputRef = useRef(null);
      const dragging = useRef(false);
      const lastY = useRef(0);

      useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);
      const commitEdit = () => { const num = parseInt(tempValue, 10); if (!isNaN(num)) { onChange(clamp(num, 60, 200)); } setEditing(false); };

      const handlePointerDown = (e) => { if (editing) return; dragging.current = true; lastY.current = e.clientY; e.currentTarget.setPointerCapture?.(e.pointerId); };
      const handlePointerMove = (e) => { if (!dragging.current) return; const delta = lastY.current - e.clientY; if (Math.abs(delta) > 3) { lastY.current = e.clientY; onChange(clamp(value + Math.sign(delta), 60, 200)); } };
      const stopDragging = () => { dragging.current = false; };
      const handleWheel = (e) => { if (editing) return; e.preventDefault(); const delta = e.deltaY > 0 ? -1 : 1; onChange(clamp(value + delta, 60, 200)); };

      return (
        <div className="flex flex-col items-center gap-1">
          <div className="font-mono text-[7px] tracking-[0.2em] text-zinc-500 mb-1">BPM</div>
          <div
            onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={stopDragging} onPointerCancel={stopDragging} onWheel={handleWheel} onDoubleClick={() => setEditing(true)}
            className="flex h-[38px] w-[56px] cursor-ns-resize select-none items-center justify-center rounded-lg border border-white/10 bg-[#16191f] shadow-[inset_0_2px_5px_black]"
          >
            {editing ? (
              <input ref={inputRef} type="text" value={tempValue} onChange={(e) => setTempValue(e.target.value)} onBlur={commitEdit} onKeyDown={(e) => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") { setTempValue(String(value)); setEditing(false); } }} className="w-full bg-transparent text-center font-mono text-[14px] font-black text-[#c084fc] outline-none" />
            ) : (
              <div className="font-mono text-[14px] font-black text-[#c084fc]">{value}</div>
            )}
          </div>
        </div>
      );
    }

    /* ========== DRY/WET KNOB ========== */
    function DryWetKnob({ value, onChange }) {
      const knobRef = useRef(null);
      const dragging = useRef(false);
      const lastY = useRef(0);

      const displayValue = Math.round(value);
      const glowIntensity = value / 100;
      
      // Геометрия SVG (Центр 95, радиус 80 -> ViewBox 190x190)
      const circumference = 2 * Math.PI * 80;
      const maxArcLength = (250 / 360) * circumference; 
      const progressArcLength = (value / 100) * maxArcLength;
      
      const rotation = -125 + (value / 100) * 250;

      const updateFromPointer = useCallback((clientY) => {
        if (!dragging.current) return;
        const delta = lastY.current - clientY;
        if (Math.abs(delta) < 0.5) return;
        lastY.current = clientY;
        onChange(clamp(value + delta * 0.6, 0, 100));
      }, [onChange, value]);

      useEffect(() => {
        const move = (e) => { if (dragging.current) updateFromPointer(e.clientY); };
        const up = () => { dragging.current = false; document.body.style.cursor = ""; document.body.style.userSelect = ""; };
        window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
        return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
      }, [updateFromPointer]);

      return (
        <div className="flex flex-col items-center justify-center">
          <div className="mb-2 text-[11px] font-black tracking-[0.2em] text-zinc-800">DRY / WET</div>
          
          <div
            ref={knobRef}
            onPointerDown={(e) => { dragging.current = true; lastY.current = e.clientY; document.body.style.cursor = "ns-resize"; e.currentTarget.setPointerCapture?.(e.pointerId); }}
            className="relative h-[160px] w-[160px] cursor-ns-resize select-none touch-none"
          >
            <svg className="absolute inset-0 h-full w-full" viewBox="0 0 190 190">
              {/* Фоновая дуга стартует ровно с -125 град от верхней оси (rotate 145 вокруг центра 95 95) */}
              <circle cx="95" cy="95" r="80" fill="none" stroke="rgba(168,85,247,.10)" strokeWidth="4" strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={circumference - maxArcLength} transform="rotate(145 95 95)" />
              {/* Прогресс-дуга */}
              <circle
                cx="95" cy="95" r="80" fill="none" stroke="#a855f7" strokeWidth="4" strokeLinecap="round"
                strokeDasharray={circumference} strokeDashoffset={circumference - progressArcLength} transform="rotate(145 95 95)"
                className="transition-[stroke-dashoffset] duration-75"
                style={{ filter: `drop-shadow(0 0 ${4 + glowIntensity * 8}px rgba(168,85,247,${0.5 + glowIntensity * 0.5}))` }}
              />
            </svg>

            <div className="absolute inset-[15px] rounded-full bg-[conic-gradient(from_0deg,#1b1d22,#8c8f94,#25282d,#aeb1b5,#181a1f,#777a80,#1b1d22)] shadow-[0_12px_25px_rgba(0,0,0,.3),inset_0_2px_2px_rgba(255,255,255,.5),inset_0_-4px_8px_black]">
              <div className="absolute inset-0 rounded-full opacity-40 bg-[repeating-conic-gradient(from_0deg,rgba(255,255,255,.22)_0deg,rgba(255,255,255,.22)_2deg,rgba(0,0,0,.25)_2deg,rgba(0,0,0,.25)_4deg)]" />
            </div>

            <div className="absolute inset-[24px] rounded-full border border-white/50 bg-[radial-gradient(circle_at_35%_27%,#fafafa_0%,#d5d7da_23%,#989ba0_52%,#55585e_79%,#24272c_100%)] shadow-[inset_5px_5px_8px_rgba(255,255,255,.65),inset_-7px_-9px_12px_rgba(0,0,0,.55),0_5px_10px_rgba(0,0,0,.35)]">
              <div
                className="absolute left-1/2 top-1/2 h-[56px] w-[2.5px] origin-[50%_100%] -translate-x-1/2 -translate-y-[100%]"
                style={{ transform: `translate(-50%, -100%) rotate(${rotation}deg)` }}
              >
                <div className="mx-auto h-[40px] w-full rounded-full bg-[#a855f7]" style={{ boxShadow: `0 0 ${4 + glowIntensity * 6}px rgba(168,85,247,${0.5 + glowIntensity * 0.5})` }} />
                <div className="absolute top-0 left-1/2 h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#e8d5ff] shadow-[0_0_8px_#c084fc,0_0_15px_#a855f7]" style={{ opacity: 0.5 + glowIntensity * 0.5 }} />
              </div>
              <div className="absolute left-1/2 top-1/2 h-3 w-3 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#191b20] shadow-[inset_0_1px_2px_black,0_0_4px_rgba(192,132,252,.35)]" />
            </div>
          </div>

          <div className="mt-3 rounded-lg border border-black/10 bg-[#16191f] px-4 py-1.5 font-mono text-xl font-black tracking-[0.16em] text-[#c084fc] shadow-[inset_0_2px_5px_black,0_2px_3px_rgba(255,255,255,.8)]">
            {String(displayValue).padStart(3, "0")}
          </div>
        </div>
      );
    }

    /* ========== FOOTSWITCH ========== */
    function Footswitch({ rendering, progress, onClick }) {
      return (
        <button type="button" disabled={rendering} onClick={onClick} className="group relative mx-auto block w-full max-w-[280px] select-none transition-transform duration-100 active:scale-[0.96] disabled:cursor-wait">
          <div className="relative h-[68px] rounded-[18px] border border-[#111318] bg-gradient-to-b from-[#343840] via-[#1c1f25] to-[#0b0d10] p-[4px] shadow-[0_6px_12px_rgba(0,0,0,.35),inset_0_1px_2px_rgba(255,255,255,.2),inset_0_-5px_8px_black]">
            <div className="relative flex h-full items-center justify-center overflow-hidden rounded-[14px] border border-black bg-[linear-gradient(180deg,#252930,#111419)] shadow-[inset_0_2px_4px_black]">
              <div className={cn("mr-3 h-3 w-3 rounded-full transition-all duration-300", rendering ? "animate-pulse bg-[#c084fc] shadow-[0_0_8px_#a855f7,0_0_20px_#a855f7]" : "bg-[#a855f7] shadow-[0_0_5px_#a855f7,0_0_12px_rgba(168,85,247,.6)]")} />
              <span className="text-[11px] font-black tracking-[0.15em] text-zinc-100">{rendering ? `RENDERING [${progress}%]` : "START FL RENDER"}</span>
            </div>
          </div>
        </button>
      );
    }

    /* ========== TRANSPORT DRAWER ========== */
    function TransportDrawer({ open, audioUrl, isPlaying, onPlayPause, onClose, waveformData }) {
      return (
        <div className={cn("fixed inset-x-0 bottom-0 z-[90] mx-auto w-full max-w-[390px] px-2 transition-transform duration-500", open ? "translate-y-0" : "translate-y-[110%]")}>
          <div className="rounded-t-[28px] border border-white/10 bg-[#e6e7e9] p-3 shadow-[0_-20px_60px_rgba(0,0,0,.45),inset_1px_1px_2px_white]">
            <div className="mx-auto mb-2 h-1 w-10 rounded-full bg-zinc-400/70" />
            <div className="flex items-center justify-between">
              <div>
                <div className="font-mono text-[7px] tracking-[0.18em] text-zinc-500">RENDER COMPLETE</div>
                <div className="mt-1 max-w-[270px] truncate text-[10px] font-black text-zinc-800">{audioUrl ? audioUrl.split('/').pop() : 'output.wav'}</div>
              </div>
              <button onClick={onClose} className="flex h-7 w-7 items-center justify-center rounded-full bg-zinc-200 text-zinc-500 shadow-[inset_1px_1px_2px_white,0_2px_3px_rgba(0,0,0,.15)] active:scale-90"><XIcon /></button>
            </div>
            <div className="mt-2 rounded-xl border border-black/10 bg-[#111318] p-2 shadow-[inset_0_2px_8px_black]">
              <div className="flex h-[35px] items-center gap-[2px] overflow-hidden">
                {Array.from({ length: 48 }, (_, i) => {
                  const wave = Math.abs(Math.sin(i * 0.71)) * 0.65 + Math.abs(Math.sin(i * 1.93)) * 0.35;
                  const height = Math.max(12, Math.round(wave * 100));
                  return (<span key={i} className="w-[3px] min-w-[3px] rounded-full bg-[#c084fc] transition-all" style={{ height: `${height}%` }} />);
                })}
              </div>
              <audio id="flockity-output-audio" src={audioUrl || undefined} controls={false} className="hidden" />
            </div>
            <div className="mt-2 flex gap-2">
              <button onClick={onPlayPause} disabled={!audioUrl} className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#191c21] text-[#c084fc] shadow-[inset_0_1px_1px_rgba(255,255,255,.1),0_3px_6px_rgba(0,0,0,.25)] active:scale-95">
                {isPlaying ? <PauseIcon /> : <PlayIcon />}
              </button>
              <button onClick={() => { if (audioUrl) { const a = document.createElement('a'); a.href = audioUrl; a.download = audioUrl.split('/').pop(); a.click(); } }} className="flex-1 rounded-xl bg-[#a855f7] py-2 text-[9px] font-black tracking-[0.14em] text-white shadow-[0_0_15px_rgba(168,85,247,.25),inset_0_1px_1px_rgba(255,255,255,.3)] active:scale-[0.98]">
                DOWNLOAD TRACK
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ========== MAIN APP ========== */
    function Flockity() {
      const [files, setFiles] = useState(INITIAL_FILES);
      const [selectedSlot, setSelectedSlot] = useState(null);
      const [dryWetValue, setDryWetValue] = useState(50);
      const [roomSize, setRoomSize] = useState("middle");
      const [bpmValue, setBpmValue] = useState(140);
      const [rendering, setRendering] = useState(false);
      const [renderProgress, setRenderProgress] = useState(0);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [audioUrl, setAudioUrl] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [waveformData, setWaveformData] = useState(null);

      const previewAudioRef = useRef(null);

      const addFiles = useCallback((bay, incomingFiles) => {
        setFiles((current) => {
          const existing = current[bay];
          const additions = incomingFiles.map((f, i) => ({ id: `${Date.now()}-${i}`, file: f, name: f.name, size: f.size, type: f.type }));
          return { ...current, [bay]: [...existing, ...additions].slice(0, MAX_SLOTS) };
        });
      }, []);

      const stopPreview = useCallback(() => { if (previewAudioRef.current) { previewAudioRef.current.pause(); previewAudioRef.current = null; } setIsPlaying(false); }, []);
      const previewFile = useCallback((bay, idx) => {
        const item = files[bay][idx]; if (!item?.file) return; stopPreview();
        const url = URL.createObjectURL(item.file);
        const audio = new Audio(url); previewAudioRef.current = audio;
        audio.addEventListener("ended", () => { URL.revokeObjectURL(url); setIsPlaying(false); });
        audio.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
      }, [files, stopPreview]);

      const deleteFile = useCallback((bay, index) => {
        setFiles((current) => ({ ...current, [bay]: current[bay].filter((_, itemIndex) => itemIndex !== index) }));
      }, []);

      const startRender = async () => {
        if (rendering) return;
        setDrawerOpen(false); setRendering(true); setRenderProgress(0); setIsPlaying(false);
        if (audioUrl) { URL.revokeObjectURL(audioUrl); setAudioUrl(null); }

        const formData = new FormData();
        formData.append("knob_value", String(dryWetValue));
        formData.append("room_size", roomSize);
        formData.append("bpm", String(bpmValue));
        formData.append("username", getTelegramUsername());
        files.loops.forEach((item) => { if (item.file) formData.append("loops", item.file); });
        files.shots.forEach((item) => { if (item.file) formData.append("shots", item.file); });

        try {
          const progressInterval = setInterval(() => { setRenderProgress((prev) => prev >= 95 ? 95 : prev + 5); }, 200);

          let response;
          try {
            response = await fetch("/api/render", { method: "POST", body: formData });
          } catch(e) {
            clearInterval(progressInterval);
            const username = getTelegramUsername();
            const randomInt = Math.floor(Math.random() * (10000 - 500 + 1)) + 500;
            const mockName = `${username}_${bpmValue}_${randomInt}_flockityapp.wav`;
            
            const sr = 44100; const samples = sr * 1.2; const buf = new ArrayBuffer(44 + samples * 2);
            const blob = new Blob([buf], { type: "audio/wav" });
            const file = new File([blob], mockName, { type: "audio/wav" });
            setAudioUrl(URL.createObjectURL(file));
            setRenderProgress(100); setRendering(false); setDrawerOpen(true);
            return;
          }

          clearInterval(progressInterval); setRenderProgress(100);
          if (!response.ok) throw new Error("Server error");
          const data = await response.json();
          if (data.status === "success" && data.download_url) {
            const audioResponse = await fetch(data.download_url);
            const audioBlob = await audioResponse.blob();
            const filename = data.download_url.split('/').pop();
            const file = new File([audioBlob], filename, { type: "audio/wav" });
            setAudioUrl(URL.createObjectURL(file));
            setRendering(false);
            setTimeout(() => setDrawerOpen(true), 150);
          }
        } catch (error) {
          alert(`Render failed: ${error.message}`);
          setRendering(false); setRenderProgress(0);
        }
      };

      const toggleOutputPlayback = () => {
        const audio = document.getElementById("flockity-output-audio");
        if (!audio || !audioUrl) return;
        if (audio.paused) { audio.play().then(() => setIsPlaying(true)); } else { audio.pause(); setIsPlaying(false); }
      };

      useEffect(() => { return () => { stopPreview(); if (audioUrl) URL.revokeObjectURL(audioUrl); }; }, [audioUrl, stopPreview]);

      const modalFiles = selectedSlot === "loops" ? files.loops : selectedSlot === "shots" ? files.shots : [];
      const [playingSlotIndex, setPlayingSlotIndex] = useState(null);
      const modalPreview = (index) => { if (!selectedSlot) return; previewFile(selectedSlot, index); setPlayingSlotIndex(index); };
      useEffect(() => { if (!isPlaying) setPlayingSlotIndex(null); }, [isPlaying]);
      const modalDelete = (index) => { if (!selectedSlot) return; deleteFile(selectedSlot, index); if (playingSlotIndex === index) { stopPreview(); setPlayingSlotIndex(null); } };

      return (
        <div className="fixed inset-0 flex h-[100dvh] w-screen items-center justify-center overflow-hidden bg-[#0d0e12] font-sans text-zinc-900">
          <div className="absolute inset-0 hidden bg-[radial-gradient(circle_at_50%_20%,#24262d_0%,#0d0e12_55%,#08090c_100%)] sm:block" />

          {/* ЖЕСТКИЙ КОНТЕЙНЕР iPHONE 17 (390 x 844) */}
          <main className="relative mx-auto flex h-full w-full max-w-[390px] flex-col overflow-hidden sm:h-[844px] sm:max-h-[850px] sm:rounded-[38px] sm:border sm:border-white/80 sm:shadow-[0_30px_80px_rgba(0,0,0,.6),0_8px_20px_rgba(0,0,0,.35)]">
            <div className="relative flex h-full flex-col overflow-hidden rounded-none bg-[#f4f4f6] shadow-[inset_1px_1px_2px_white,inset_-2px_-2px_5px_rgba(0,0,0,.14)] sm:rounded-[38px]">
              <div className="pointer-events-none absolute left-4 top-4 z-10"><Screw /></div>
              <div className="pointer-events-none absolute right-4 top-4 z-10"><Screw /></div>
              <div className="pointer-events-none absolute bottom-4 left-4 z-10"><Screw /></div>
              <div className="pointer-events-none absolute bottom-4 right-4 z-10"><Screw /></div>

              <div className="flex min-h-0 flex-1 flex-col justify-between px-3 pb-2 pt-3">
                
                {/* HEADER */}
                <header className="flex shrink-0 items-center justify-between px-2 pb-2">
                  <div>
                    <div className="flex items-baseline">
                      <h1 className="text-[20px] font-black tracking-[-0.06em] text-[#17191e]">FLOCKITY</h1>
                      <span className="ml-0.5 text-[22px] font-black text-[#a855f7]">.</span>
                    </div>
                    <div className="font-mono text-[7px] font-bold tracking-[0.22em] text-zinc-400">NEURAL SOUND LAB</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button type="button" onClick={() => window.open("https://instagram.com/", "_blank")} className="flex h-9 w-9 items-center justify-center rounded-full border border-white/80 bg-[linear-gradient(145deg,#fafafa,#aeb1b6)] text-[#34373d] shadow-[inset_1px_1px_2px_white,inset_-2px_-2px_3px_rgba(0,0,0,.25),0_3px_6px_rgba(0,0,0,.16)] transition active:scale-90">
                      <InstagramIcon size={15} />
                    </button>
                    <button type="button" onClick={() => window.open("https://t.me/", "_blank")} className="flex h-9 w-9 items-center justify-center rounded-full border border-white/80 bg-[linear-gradient(145deg,#fafafa,#aeb1b6)] text-[#34373d] shadow-[inset_1px_1px_2px_white,inset_-2px_-2px_3px_rgba(0,0,0,.25),0_3px_6px_rgba(0,0,0,.16)] transition active:scale-90">
                      <TelegramIcon size={16} />
                    </button>
                  </div>
                </header>

                {/* OLED DISPLAY (ТОЛЬКО ВОЛНА) */}
                <section className="shrink-0 rounded-[22px] border border-black/80 bg-[#0c0d12] p-3 shadow-[inset_0_3px_12px_black,inset_0_-1px_1px_rgba(255,255,255,.08),0_4px_10px_rgba(0,0,0,.25)]">
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-mono text-[7px] tracking-[0.18em] text-zinc-600">FLOCKITY // MASTER RACK</span>
                    <span className="flex items-center gap-1.5 font-mono text-[7px] font-bold tracking-[0.1em] text-[#c084fc]">
                      <LED active={rendering} />
                      {rendering ? "CLI BUSY" : "DSP READY"}
                    </span>
                  </div>
                  <div className="overflow-hidden rounded-xl border border-white/[0.04] bg-[#080a0e] px-2 shadow-[inset_0_2px_8px_black]">
                    <Waveform active={rendering || files.loops.length > 0} />
                  </div>
                </section>

                {/* INPUT BAYS (РЯДОМ, СЕТКА) */}
                <section className="mt-2 shrink-0 grid grid-cols-2 gap-2">
                  <InputBay bay="loops" count={files.loops.length} onFiles={(i) => addFiles("loops", i)} onManage={() => setSelectedSlot("loops")} />
                  <InputBay bay="shots" count={files.shots.length} onFiles={(i) => addFiles("shots", i)} onManage={() => setSelectedSlot("shots")} />
                </section>

                {/* СРЕДНЯЯ ЗОНА УПРАВЛЕНИЯ */}
                <div className="flex flex-1 items-center justify-between px-1 sm:px-2 pt-2 pb-1">
                  {/* S|M|L VERTICAL */}
                  <div className="w-[50px] shrink-0 flex justify-center">
                    <RoomSizeSelectorVertical value={roomSize} onChange={setRoomSize} />
                  </div>
                  
                  {/* MAIN KNOB */}
                  <div className="flex-1 flex justify-center mt-3">
                    <DryWetKnob value={dryWetValue} onChange={setDryWetValue} />
                  </div>

                  {/* BPM */}
                  <div className="w-[50px] shrink-0 flex justify-center">
                    <BpmControl value={bpmValue} onChange={setBpmValue} />
                  </div>
                </div>

                {/* FOOTSWITCH */}
                <section className="shrink-0 pb-1 pt-1">
                  <Footswitch rendering={rendering} progress={renderProgress} onClick={startRender} />
                  <div className="mt-3 text-center font-mono text-[8px] font-bold tracking-[0.15em] text-zinc-400">
                    FLOCKITY by @muinne__
                  </div>
                </section>
                
              </div>
            </div>
          </main>

          {selectedSlot && (<SlotManager type={selectedSlot} files={modalFiles} onClose={() => { stopPreview(); setSelectedSlot(null); }} onDelete={modalDelete} onPreview={modalPreview} playingIndex={playingSlotIndex} />)}
          <TransportDrawer open={drawerOpen} audioUrl={audioUrl} isPlaying={isPlaying} onPlayPause={toggleOutputPlayback} onClose={() => { const el = document.getElementById("flockity-output-audio"); if (el) { el.pause(); el.currentTime = 0; } setIsPlaying(false); setDrawerOpen(false); }} waveformData={waveformData} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Flockity />);
  </script>
</body>
</html>
